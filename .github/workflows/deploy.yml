name: Deploy Sub-Store to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/tests.yml

  deploy:
    name: Deploy
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: sub-store-production
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate required backend path secret
        env:
          SUB_STORE_FRONTEND_BACKEND_PATH: ${{ secrets.SUB_STORE_FRONTEND_BACKEND_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${SUB_STORE_FRONTEND_BACKEND_PATH:-}" =~ ^/?[A-Za-z0-9_-]+$ ]]; then
            echo '::error::Set repository secret SUB_STORE_FRONTEND_BACKEND_PATH to a non-empty path name (letters, digits, _ or -); the leading / is optional.'
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci

      - name: Verify Cloudflare authentication
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler whoami

      - name: Download tested frontend assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Verify frontend assets
        run: test -f frontend-dist/index.html

      - name: Configure optional ADMIN_TOKEN
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUB_STORE_ADMIN_TOKEN: ${{ secrets.SUB_STORE_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUB_STORE_ADMIN_TOKEN:-}" ]]; then
            echo 'SUB_STORE_ADMIN_TOKEN is not configured; skipping Cloudflare secret.'
            exit 0
          fi

          printf '%s' "$SUB_STORE_ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN

      - name: Configure native backend path
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUB_STORE_FRONTEND_BACKEND_PATH: ${{ secrets.SUB_STORE_FRONTEND_BACKEND_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$SUB_STORE_FRONTEND_BACKEND_PATH" | npx wrangler secret put SUB_STORE_FRONTEND_BACKEND_PATH

      - name: Final Worker deployment
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy

      - name: Show deployment information
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deployments list
