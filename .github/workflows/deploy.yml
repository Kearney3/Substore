name: Deploy Sub-Store to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sub-store-production
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.0.9'

jobs:
  deploy:
    name: Build, Test and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate required backend path secret
        env:
          SUB_STORE_FRONTEND_BACKEND_PATH: ${{ secrets.SUB_STORE_FRONTEND_BACKEND_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${SUB_STORE_FRONTEND_BACKEND_PATH:-}" =~ ^/[A-Za-z0-9_-]{20,}$ ]]; then
            echo '::error::Set repository secret SUB_STORE_FRONTEND_BACKEND_PATH to / followed by at least 20 URL-safe characters (letters, digits, _ or -).'
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Verify Cloudflare authentication
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler whoami

      - name: Sync and build official Sub-Store Front-End
        env:
          PNPM_VERSION: ${{ env.PNPM_VERSION }}
        run: node scripts/sync-official-frontend.mjs

      - name: Verify frontend assets
        run: |
          test -d frontend-dist
          test -f frontend-dist/index.html
          echo 'Frontend build verified.'
          find frontend-dist -maxdepth 2 -type f | head -100

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci

      - name: Generate Worker runtime types
        working-directory: worker
        run: npx wrangler types

      - name: TypeScript typecheck
        working-directory: worker
        run: npm run typecheck

      - name: Run local Worker contract tests
        run: node scripts/test-worker.mjs

      - name: Configure optional ADMIN_TOKEN
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUB_STORE_ADMIN_TOKEN: ${{ secrets.SUB_STORE_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUB_STORE_ADMIN_TOKEN:-}" ]]; then
            echo 'SUB_STORE_ADMIN_TOKEN is not configured; skipping Cloudflare secret.'
            exit 0
          fi

          printf '%s' "$SUB_STORE_ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN

      - name: Configure native backend path
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUB_STORE_FRONTEND_BACKEND_PATH: ${{ secrets.SUB_STORE_FRONTEND_BACKEND_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$SUB_STORE_FRONTEND_BACKEND_PATH" | npx wrangler secret put SUB_STORE_FRONTEND_BACKEND_PATH

      - name: Final Worker deployment
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy

      - name: Show deployment information
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deployments list

      - name: Upload deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sub-store-deployment-diagnostics
          path: |
            frontend-dist/
            worker/worker-configuration.d.ts
          if-no-files-found: ignore
          retention-days: 7
