name = "sub-store-cloudflare"
main = "src/index.ts"
compatibility_date = "2026-08-17"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "../frontend-dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/download/*", "/share/*", "/health"]

[vars]
SUB_STORE_CORS_ALLOWED_ORIGINS = "*"
CACHE_TTL_SECONDS = "900"
UPSTREAM_REPO = "https://github.com/sub-store-org/Sub-Store"
UPSTREAM_FRONTEND_REPO = "https://github.com/sub-store-org/Sub-Store-Front-End"

# Reuse the provisioned resources on every deployment, including retries.
[[d1_databases]]
binding = "DB"
database_name = "sub-store-cloudflare-db"
database_id = "106fd24e-762c-471a-9531-c76411e2f891"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "40355827169c4416976a96db2c00fd46"

[triggers]
crons = []

[[durable_objects.bindings]]
name = "SUBSTORE"
class_name = "SubscriptionStore"

[[migrations]]
tag = "substore-sqlite-v1"
new_sqlite_classes = ["SubscriptionStore"]

[observability]
enabled = true
