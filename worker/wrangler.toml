name = "sub-store-cloudflare"
main = "src/index.ts"
compatibility_date = "2026-08-17"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "../frontend-dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/download/*", "/share/*", "/health"]

[triggers]
crons = []

[[durable_objects.bindings]]
name = "SUBSTORE"
class_name = "SubscriptionStore"

[[migrations]]
tag = "substore-sqlite-v1"
new_sqlite_classes = ["SubscriptionStore"]

[observability]
enabled = true
